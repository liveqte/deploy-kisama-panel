<svg xmlns="http://www.w3.org/2000/svg" width="425" height="356" viewBox="-212.5 -178 425 356" role="img" aria-label="KISAMA">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25d8f0"/>
      <stop offset="1" stop-color="#f218b4"/>
    </linearGradient>
  </defs>

  <!-- K：白色纯色包裹 + 渐变填充；viewBox 紧贴字形裁剪，画布尺寸即视觉尺寸，方便页面排版对齐 -->
  <g transform="skewX(-8)"
     font-family="'Arial Black','Segoe UI Black',sans-serif"
     font-weight="900" text-anchor="middle">
    <!-- 包裹用中间调石板色：白底上可见、黑底上也可见，两种模式都不产生"缩一圈"错觉 -->
    <text x="0" y="150" font-size="420" fill="none" stroke="#8fa3bd" stroke-width="56" stroke-linejoin="round">K</text>
    <text x="0" y="150" font-size="420" fill="url(#ink)">K</text>
  </g>
</svg>
